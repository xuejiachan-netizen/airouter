worker_processes 1;
error_log /app/nginx-8080/logs/error.log;
pid /app/nginx-8080/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /app/nginx-1.30.4/conf/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        server_name bibb.ypic.cn;

        # 根路径重定向
        location = / {
            return 302 /biweb-old/;
        }

        location /biweb-old/ {
            proxy_pass http://bibb1.ypic.cn/biweb/;
            proxy_set_header Host              bibb1.ypic.cn;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  bibb.ypic.cn;
            proxy_set_header X-Forwarded-Port  8080;
            # 关闭 gzip，让 sub_filter 能改原始文本
            proxy_set_header Accept-Encoding    "";
            # MIME 类型兜底（不再写 text/html，mime.types 已有）
            types {
                text/css                        css;
                application/javascript          js;
                text/plain                      txt;
                application/json                json;
                text/xml                        xml;
                image/png                       png;
                image/jpeg                      jpg jpeg;
                image/gif                       gif;
                image/svg+xml                   svg;
                image/x-icon                    ico;
                font/woff                       woff;
                font/woff2                      woff2;
            }
            sub_filter_types text/html
                            application/javascript
                            text/css
                            text/plain
                            text/xml
                            application/json;
            sub_filter_once off;
            # 只替换属性中的路径前缀，不碰其他内容
            sub_filter 'src="/biweb/'    'src="/biweb-old/';
            sub_filter "src='/biweb/"    "src='/biweb-old/";
            sub_filter 'href="/biweb/'   'href="/biweb-old/';
            sub_filter "href='/biweb/"   "href='/biweb-old/";
            sub_filter 'url(/biweb/'     'url(/biweb-old/';
            sub_filter "url('/biweb/"   "url('/biweb-old/";
            sub_filter 'url("/biweb/'    'url("/biweb-old/';
            # 重定向 URL 改写
            proxy_redirect ~^http://bibb1\.ypic\.cn/biweb/(.*)$ /biweb-old/$1;
            proxy_redirect ~^http://bibb\.ypic\.cn/biweb/(.*)$  /biweb-old/$1;
            proxy_redirect ~^/biweb/(.*)$                       /biweb-old/$1;
            # Cookie Path 改写
            proxy_cookie_path /biweb /biweb-old;
            proxy_cookie_path /      /biweb-old;
            # 流式，不走磁盘缓存
            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            client_max_body_size 100m;
        }

        location /biweb/ {
            # 把 /biweb/X 内部重写为 /biweb-old/X，让上面的 location 处理
            rewrite ^/biweb/(.*)$ /biweb-old/$1 last;
        }


        # error_page 必须放在 server {} 里面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            root html;
        }
    }
}